<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insure! — 외국인 주거계약 서비스</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard', -apple-system, sans-serif; background: #F5F6F8; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .logo { width: 56px; height: 56px; background: #3182F6; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; font-weight: 900; margin-bottom: 16px; }
    h1 { font-size: 28px; font-weight: 900; color: #191F28; margin-bottom: 8px; text-align: center; }
    p  { font-size: 15px; color: #8B95A1; margin-bottom: 40px; text-align: center; line-height: 1.6; }
    .cards { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 360px; }
    .card { background: white; border-radius: 20px; padding: 24px; text-decoration: none; border: 2px solid transparent; transition: border-color .15s, transform .15s; box-shadow: 0 2px 12px rgba(0,0,0,.06); display: block; }
    .card:active { transform: scale(.98); }
    .card.blue { border-color: #BFDBFE; }
    .card.green { border-color: #A7F3D0; }
    .card-icon { font-size: 32px; margin-bottom: 12px; }
    .card-title { font-size: 18px; font-weight: 800; color: #191F28; margin-bottom: 6px; }
    .card-desc  { font-size: 13px; color: #8B95A1; line-height: 1.6; }
    .badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; margin-bottom: 10px; }
    .badge-blue  { background: #EFF6FF; color: #1971C2; }
    .badge-green { background: #ECFDF5; color: #059669; }
    .footer { margin-top: 32px; font-size: 12px; color: #B0B8C1; text-align: center; }
  </style>
</head>
<body>
  <div class="logo">I</div>
  <h1>Insure!</h1>
  <p>외국인과 집주인이 함께 작성하는<br>안전한 주거 계약 서비스</p>
  <div class="cards">
    <a href="tenant.html" class="card blue">
      <div class="badge badge-blue">임차인 (외국인)</div>
      <div class="card-icon">🌏</div>
      <div class="card-title">외국인 임차인 화면</div>
      <div class="card-desc">계약 조건 확인, 특약 AI 분석, 전자서명까지 단계별로 안내받으세요.</div>
    </a>
    <a href="landlord.html" class="card green">
      <div class="badge badge-green">집주인 (임대인)</div>
      <div class="card-icon">🏠</div>
      <div class="card-title">집주인 화면</div>
      <div class="card-desc">매물 등록, 특약 입력, 임차인 초대 링크 생성 및 계약 진행 현황을 관리하세요.</div>
    </a>
  </div>
  <p class="footer">MVP 프로토타입 · Insure! (KoZip) 2024</p>
</body>
</html>
